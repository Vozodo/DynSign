<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>DynSign – Settings</title>
    <link rel="stylesheet" href="options.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <img src="../icons/icon.png" alt="DynSign Logo" class="logo" />
            <h1>DynSign – Settings</h1>
        </div>

        <form id="settingsForm">
            <div class="form-group">
                <label for="url">Signature URL:</label>
                <input type="text" id="url"
                    placeholder="https://vozodo.it/mailsign.php?e={{email}}&n={{name}}&o={{organization}}">
                <small>Available placeholders:
                    <code>{{email}}</code>, <code>{{name}}</code>, <code>{{organization}}</code>,
                    <code>{{date}}</code>, <code>{{version}}</code>,
                    <code>{{lang}}</code>
                </small>
            </div>

            <div class="form-group">

                <label>
                    Enable signature for these accounts:
                    <span class="info-icon">i
                        <span class="tooltip">
                            If it is enabled for an identity, the current signature will be
                            overwritten!
                        </span>
                    </span>
                </label>
                <div id="emailList" class="email-list">
                    <!-- Dynamically filled by options.js -->
                </div>
            </div>


            <div class="form-group">
                <label for="interval">Update interval:</label>
                <select id="interval">
                    <option value="15">15 min</option>
                    <option value="30">30 min</option>
                    <option value="60">1 h</option>
                    <option value="240">4 h</option>
                    <option value="360">6 h</option>
                </select>
            </div>

            <div class="form-group">
                <label for="debug">Troubleshooting</label>
                <input type="checkbox" id="debug" name="debug">
                <label class="checkbox-label">Debug Mode</label>
            </div>


            <div class="form-actions">
                <button type="button" id="save">Save</button>
                <button type="button" id="refreshNow">Update now</button>
                <button type="button" id="testUrl">Test URL</button>
            </div>
        </form>

        <div class="status" id="status"></div>

        <div class="support-box">
            <h2>Enjoying DynSign?</h2>
            <p>
                If you like this extension, please consider leaving a
                <a href="https://addons.thunderbird.net/en-US/thunderbird/addon/dynsign/" target="_blank">
                    review on the Thunderbird Add-ons page
                </a>
                or giving it a
                <a href="https://github.com/vozodo/DynSign" target="_blank">
                    ⭐ star on GitHub
                </a>.
                It really helps!
            </p>
        </div>
    </div>

    <script src="options.js"></script>
</body>

</html>
